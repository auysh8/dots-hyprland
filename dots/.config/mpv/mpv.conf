# ==================================================================================================
# High Quality 2025 Config (Optimized for Performance & Quality)
# ==================================================================================================

# --- General System ---
keep-open=yes
profile=gpu-hq          # Load high quality defaults
vo=gpu-next             # BEST quality driver (libplacebo). Modern standard.
hwdec=auto-safe         # Safe hardware decoding (prevents lag)

# --- HDR to SDR Tone Mapping (The "Wow" Factor) ---
# 'gpu-next' handles HDR much better but needs strict targets for SDR screens.
tone-mapping=spline     # Best perceptual balance for HDR->SDR
target-peak=100         # Calibrate for standard SDR screen brightness (nits)
target-prim=bt.709      # FORCE standard SDR colors (Fixes dull/washed out look)
target-trc=srgb         # Standard gamma curve
gamut-mapping-mode=auto # Smartly map wide gamut colors down to your screen
hdr-compute-peak=yes    # Dynamic scene brightness adjustment

# --- Scaling (Sharpness without Lag) ---
scale=lanczos           # Sharp and clean (better than spline36)
cscale=lanczos          # Chroma scaling matching luma
dscale=mitchell         # Best downscaler for downsampling 4K
correct-downscaling=yes # Linear light downscaling
linear-downscaling=yes  # Better detail when shrinking
sigmoid-upscaling=yes   # Fewer artifacts when upscaling
# --- Debanding (Dark Scene Fix) ---
deband=yes
deband-iterations=1     # Keep low for performance
deband-threshold=48     # Aggressive enough for banding
deband-grain=0          # No added noise

# --- Cache ---
cache=yes
demuxer-max-bytes=200M  # Buffer size
